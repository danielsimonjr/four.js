<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>four.js — First 2D Scene</title>
    <style>
      /* Minimal on purpose: the point of this page is the canvas. */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14161c;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: #9aa3b2;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
      }

      p {
        margin: 0;
        max-width: 800px;
      }

      /*
        The CSS size is the layout size; the drawing-buffer size is set from
        JavaScript via `renderer.resize(...)`, so the scene stays crisp on
        high-DPI displays. The width/height attributes are the fallback the
        renderer reads when `resize` is never called.
      */
      #scene {
        width: 800px;
        height: 600px;
        max-width: 100%;
        display: block;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="scene" width="800" height="600"></canvas>
      <p>
        four.js — scene, render and motion in one loop: an orbiting circle
        (kinematic path following), a tumbling box (procedural motion), and a
        static ground plane.
      </p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
