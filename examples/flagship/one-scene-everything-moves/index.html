<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>four.js — One Scene, Everything Moves</title>
    <style>
      /* Minimal on purpose: the point of this page is the canvas. */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0b11;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: #9aa3b2;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
      }

      p {
        margin: 0;
        max-width: 960px;
      }

      #status[data-state="loading"] {
        color: #6c7486;
        font-style: italic;
      }

      #status[data-state="error"] {
        color: #d97070;
      }

      /*
        The CSS size is the layout size; the drawing-buffer size is set from
        JavaScript (`ApplicationOptions.width/height/resolution`), so the scene
        stays crisp on high-DPI displays. 960 x 600 is the 8:5 shape the
        camera's `aspect` is built from — change one and the other has to change
        with it.
      */
      #scene {
        width: 960px;
        height: 600px;
        max-width: 100%;
        display: block;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="scene" width="960" height="600"></canvas>
      <p>
        four.js — the §118 flagship: <strong>one scene</strong> holding a
        rotating 3D cube, a 2D vector orbit, a spring-connected pendulum, a
        bouncing rigid body, a motorised hinge, particles, world-space labels
        and a screen-space control panel — all on one scene graph, one
        fixed-step loop and one frame.
      </p>
      <p id="status" data-state="loading">starting…</p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
