<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>four.js — First Animated Scene</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14161c;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: #9aa3b2;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
      }

      p {
        margin: 0;
        max-width: 800px;
      }

      #status {
        margin: 0;
        max-width: 800px;
        font-size: 12px;
        color: #6c7486;
      }

      #scene {
        width: 800px;
        height: 600px;
        max-width: 100%;
        display: block;
        border-radius: 6px;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="scene" width="800" height="600"></canvas>
      <p id="status" aria-live="polite"></p>
      <p>
        §93 first-animated-scene — the same page as
        <code>examples/first-2d-scene</code>: tweens, a clip and a timeline
        beside kinematic path-following and pointer input.
      </p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
