name: Docs

# Publishes the §93 documentation site to GitHub Pages: the TypeDoc API
# reference, the built example applications (the public interactive demos),
# and HTML renderings of docs/guides/*.md (Pages serves files; it does not
# render Markdown, so tools/render-guides.mjs converts them at assemble time).
#
# Independent of ci.yml on purpose: docs are not a gate, and a docs failure must
# not read as a red build. The package build and the TypeDoc run happen here
# anyway, so a genuinely broken tree still cannot deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one deployment at a time; queue rather than cancel, so a
# superseded run cannot abort a deployment that is already mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    env:
      # Every example directory that has a main.ts. Named once, looped over
      # twice. Nested flagships (`flagship/<demo>`) are taken as written —
      # the `vite build` path, `--base` and `mkdir -p` all accept a slash.
      # `--base=/four.js/examples/<name>/` is required: Pages hosts this
      # repository at https://<owner>.github.io/four.js/, so a bundle built
      # with the default base "/" requests assets from the domain root and
      # loads nothing. See website/README.md.
      EXAMPLES: first-2d-scene first-3d-scene first-animated-scene first-physics-scene mixed-scene physics-playground mechanism blending particles-demo ui-demo character-controller flagship/one-scene-everything-moves flagship/motor-digital-twin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # TypeDoc reads the built reference chain, and the examples import the
      # umbrella package by its published specifier, which resolves to
      # `packages/four/dist`. Both need this first.
      - name: Build
        run: bun run build

      - name: Build API docs
        run: bun run docs

      # Pages serves this repository at https://<owner>.github.io/four.js/, so
      # every example is hosted under a subpath and needs `--base` at build time
      # — a bundle built with the default base "/" requests its assets from the
      # domain root and loads nothing. The example vite configs deliberately do
      # not hardcode a base: it is a property of where a bundle is deployed, not
      # of the example, and both `vite preview` and the Playwright browser gate
      # serve at the root.
      - name: Build the example sites
        run: |
          for example in $EXAMPLES; do
            bunx vite build "examples/$example" --base="/four.js/examples/$example/"
          done

      - name: Assemble the site
        run: |
          mkdir -p _site/examples
          cp website/index.html _site/index.html
          cp -R docs/api _site/api
          bun tools/render-guides.mjs --out=_site/guides
          bun tools/render-spec-pdf.mjs
          if [ -f docs/SPECIFICATION.generated.pdf ]; then
            cp docs/SPECIFICATION.generated.pdf _site/SPECIFICATION.generated.pdf
          fi
          for example in $EXAMPLES; do
            mkdir -p "_site/examples/$example"
            cp -R "examples/$example/dist/." "_site/examples/$example/"
          done
          find _site -maxdepth 2 -type d

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
