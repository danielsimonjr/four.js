name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, test, and checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The examples are consumers, not workspace packages: they import the
      # umbrella package by its published specifier, which resolves to
      # `packages/four/dist/*.d.ts`. The build step above must therefore precede
      # this one.
      - name: Typecheck examples
        run: pnpm run typecheck:examples

      - name: Test
        run: pnpm -r --workspace-concurrency=4 run test

      # Same unit tests, re-run per package under v8 instrumentation against the
      # shared thresholds in vitest.coverage.config.ts. Kept separate so the
      # plain `test` path above stays uninstrumented and fast.
      - name: Unit test coverage thresholds
        run: pnpm run coverage

      - name: Lint
        run: pnpm lint

      - name: Check specification
        run: pnpm check-spec

      # Architecture invariants. `graph` regenerates docs/Architecture from a full
      # parse; `graph:check` then asserts every browser-facing `.` entry stays free
      # of node: builtins. four.js targets the browser, so a node: import reaching a
      # package's main entry is a shipping bug, and it is invisible to tsc and to
      # unit tests running under Node.
      - name: Check architecture invariants (dependency graph)
        run: |
          pnpm graph
          pnpm graph:check
          pnpm graph:test

      # `pnpm docs` without `run` is a pnpm builtin no-op; the build step above
      # must precede this because TypeDoc reads the built reference chain.
      - name: Build API docs
        run: pnpm run docs

      # All three example sites must be built: playwright.config.ts starts a
      # vite preview server per example, and vite preview hard-errors on a
      # missing dist (found at the Phase 6 exit, WP-6.6-fix1).
      # Builds EVERY example, because playwright.config.ts starts a `vite preview`
      # for each entry of its webServer array and preview serves a prebuilt dist.
      # This was three separate steps covering three of five examples; `blending`
      # and `particles-demo` were added to the config in e6072ee without matching
      # steps, so preview died with "The directory dist does not exist" and the
      # browser job had been red ever since. One script = one place to update.
      - name: Build examples
        run: pnpm examples:build

      # CI runners ship no browsers, and this repository deliberately keeps
      # browser downloads out of the local scripts: the dev sandbox already has
      # Chromium (PLAYWRIGHT_BROWSERS_PATH), which playwright.config.ts finds.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Runs against the example built above; SwiftShader supplies WebGL 2.
      - name: Browser test
        run: pnpm test:browser

      - name: Check bundle size
        run: pnpm size

      - name: Cross-package test suites
        run: pnpm test:suites

      # Visibility only: unfixable advisories must not block the pipeline.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true
