name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this workflow rather than restating its job set, so a
  # release clears exactly the gates a pull request clears. Additive: it changes
  # nothing about how CI runs on push or pull_request.
  workflow_call:

jobs:
  ci:
    name: Build, test, and checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bun is the workspace package manager and script runner (RFC 0006).
      # Node stays installed for Playwright's browser install helpers and the
      # two `node --test` tool suites (`publish-names:test`, `graph:test`).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # The examples are consumers, not workspace packages: they import the
      # umbrella package by its published specifier, which resolves to
      # `packages/four/dist/*.d.ts`. The build step above must therefore precede
      # this one.
      - name: Typecheck examples
        run: bun run typecheck:examples

      # `tests/` is outside every package's tsc project and outside the examples
      # project, so until 2026-08-21 nothing type-checked the cross-package
      # suites: option-object typos (`new OrthographicCamera({ height, aspect })`
      # — fields that type does not declare) were accepted and silently ignored,
      # and three integration harnesses asserted on invisible draws for it
      # (R-8). `tests/tsconfig.json` already existed; this is the step that runs
      # it. Placed after Build for the same reason as the examples: the suites
      # import `four/*` through the workspace symlink into `packages/four/dist`.
      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Test
        run: bun run test

      # Same unit tests, re-run per package under v8 instrumentation against the
      # shared thresholds in vitest.coverage.config.ts. Kept separate so the
      # plain `test` path above stays uninstrumented and fast.
      - name: Unit test coverage thresholds
        run: bun run coverage

      - name: Lint
        run: bun run lint

      - name: Check specification
        run: bun run check-spec

      # Doc-truth gate (added 2026-08-05). Prose has no type checker: the sweep
      # that added this found claims that were false when written and survived
      # for months. check-docs pins the ones that were fixed by hand — example
      # counts against `git ls-files`, placeholder directories that docs must
      # not send readers to, and the exact retired wordings — so a revert or a
      # copy-paste from an old revision fails here instead of shipping.
      - name: Check documentation truth
        run: bun run check-docs

      # §90 compatibility drift (added 2026-08-07). The solver-adapter block of
      # docs/COMPATIBILITY.md is generated from the adapters' live capability
      # declarations; this fails when an adapter's declaration changes without
      # the committed document being regenerated. Needs the build step above
      # (the generator imports each package's dist).
      - name: Check compatibility tables
        run: bun run check-compat

      # Architecture invariants. `graph` regenerates docs/Architecture from a full
      # parse; `graph:check` then asserts every browser-facing `.` entry stays free
      # of node: builtins. four.js targets the browser, so a node: import reaching a
      # package's main entry is a shipping bug, and it is invisible to tsc and to
      # unit tests running under Node. `graph:duplicates` reads the report `graph`
      # just regenerated (hence --no-regen in the script) and fails on any
      # TRUE_DUPLICATE symbol name beyond docs/Architecture/duplicate-baseline.json.
      - name: Check architecture invariants (dependency graph)
        run: |
          bun run graph
          bun run graph:check
          bun run graph:duplicates
          bun run graph:test

      # TypeDoc reads the built reference chain; `bun run docs` (not a bare
      # `bun docs`) is required so the root script wins.
      - name: Build API docs
        run: bun run docs

      # All example sites must be built: playwright.config.ts starts a
      # vite preview server per example, and vite preview hard-errors on a
      # missing dist (found at the Phase 6 exit, WP-6.6-fix1).
      - name: Build examples
        run: bun run examples:build

      # CI runners ship no browsers, and this repository deliberately keeps
      # browser downloads out of the local scripts: the dev sandbox already has
      # Chromium (PLAYWRIGHT_BROWSERS_PATH), which playwright.config.ts finds.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Runs against the example built above; SwiftShader supplies WebGL 2.
      - name: Browser test
        run: bun run test:browser

      - name: Check bundle size
        run: bun run size

      - name: Cross-package test suites
        run: bun run test:suites

      # Visibility only: unfixable advisories must not block the pipeline.
      - name: Audit dependencies
        run: bun audit --audit-level=high
        continue-on-error: true
