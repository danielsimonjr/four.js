name: Release

# §94 release machinery. Changesets keeps a "Version Packages" pull request up to
# date on main; merging that PR applies the bumps, and this workflow then
# publishes what the merge produced.
#
# Publishing is deliberately inert until an owner enables it. The publish step
# runs only when an `NPM_TOKEN` secret exists; with no secret configured the
# workflow still succeeds and simply maintains the version PR. Adding the secret
# is the owner's decision (§94 0.1) and is the one action that turns this on.
#
# The published names are not the workspace names — `four` and `@four/*` become
# `@danielsimonjr/fourjs` and `@danielsimonjr/fourjs-*` (spec §98 rev 1.6).
# `tools/apply-publish-names.mjs` applies that mapping into a staging directory
# outside the checkout and the publish runs from there, so a failed or cancelled
# release can never leave a renamed working tree behind. See `.changeset/README.md`.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time: two concurrent runs would race each other's push to the
# changeset-release branch. Never cancel a run mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The full CI job set, reused rather than restated. A copy of ci.yml's steps
  # here would start drifting the first time a step is added to one and not the
  # other, and the drift would be silent until a release shipped something CI
  # would have caught.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Version and publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the changeset-release branch and its tags
      pull-requests: write # open and refresh the "Version Packages" PR
      id-token: write # npm provenance, once publishing is enabled
    steps:
      # Changesets compares against `baseBranch`, so it needs real history.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # `registry-url` is what makes setup-node write an ~/.npmrc that reads
      # NODE_AUTH_TOKEN; without it `npm publish` has no credentials. Node stays
      # for the publish loop and `node --test` publish-names suite (RFC 0006).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The staging copy publishes each package's `files` entries, which for
      # every package here means `dist`. Nothing is publishable unbuilt.
      - name: Build
        run: bun run build

      # Fails the release before anything is versioned if the §98 mapping cannot
      # be applied cleanly — an unmapped package name, a lost subpath export, a
      # `workspace:` range that would reach npm unresolved.
      - name: Check the publish-name mapping
        run: bun run publish-names

      - name: Test the publish-name mapping
        run: bun run publish-names:test

      # `secrets` cannot be read from a step-level `if`, so the presence of the
      # token becomes a step output. The token value itself is never printed.
      - name: Detect npm credentials
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is configured: this run may publish."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No NPM_TOKEN secret: version PR only, nothing will be published."
          fi

      # Note for whoever enables publishing: `release:publish` runs `npm publish`
      # over the staged tree rather than `changeset publish`, because the staged
      # packages carry the published names and the workspace does not. One
      # consequence is that changesets/action sees no "New tag:" lines and so
      # creates no GitHub releases. If those are wanted, add a `changeset tag`
      # step after this one — deliberately left out rather than shipped untested.
      - name: Create version pull request, and publish when enabled
        uses: changesets/action@v2
        with:
          version: bun run release:version
          # An empty `publish` means "do not publish" to the action, so this
          # expression is the whole owner gate.
          publish: ${{ steps.npm.outputs.configured == 'true' && 'bun run release:publish' || '' }}
          title: "Release: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Staged outside the checkout, so `git status` stays clean and the
          # version commit can never pick up a renamed copy of the workspace.
          FOUR_PUBLISH_STAGING: ${{ runner.temp }}/publish-staging
          NPM_CONFIG_PROVENANCE: true
