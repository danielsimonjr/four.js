name: Optimization workspace snapshot

on:
  push:
    branches: [perf/geometry-buffer-reuse]
    paths: [.github/workflows/optimization-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Archive source and installed test dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/four-optimization"
          git archive HEAD > "$RUNNER_TEMP/four-optimization/source.tar"
          find . -type d -name node_modules -prune -print0 | tar --null -T - -czf "$RUNNER_TEMP/four-optimization/dependencies.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: four-optimization-workspace
          path: ${{ runner.temp }}/four-optimization/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
