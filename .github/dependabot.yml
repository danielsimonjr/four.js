version: 2
updates:
  # npm, NOT bun, DELIBERATELY -- do not "fix" this to bun.
  # Dependabot's bun support parses only bun.lock lockfileVersion 1, and Bun writes version 2
  # (this repo's bun.lock is v2), so every bun-ecosystem run fails immediately with
  #   "Unsupported bun.lock 'lockfileVersion' 2 in /bun.lock"
  # and NO dependency update can be proposed. Diagnosed three times across this workspace on
  # 2026-09-04/05: deepthinking-mcp 524ada7f, fzf-mcp 387ee494, and MathTS c0dd0d12 (where a Bun
  # migration reintroduced it).
  #
  # This hides badly: security ALERTS keep working -- they are dependency-graph based -- so
  # nothing turns red while automated REMEDIATION is dead. "0 open PRs" then reads as health when
  # it partly means "Dependabot cannot open one".
  #
  # The npm ecosystem updates package.json ranges only; bun.lock stays authoritative and is
  # regenerated by `bun install` when a bump lands, never by Dependabot. That avoids carrying two
  # lockfiles, which would be a second source of truth.
  # KNOWN COST: because Dependabot cannot write bun.lock, a bump whose resolution changes will
  # fail CI's `bun install --frozen-lockfile` until someone regenerates the lockfile on the
  # branch. Revisit when Dependabot's bun parser supports lockfileVersion 2.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: 'development'
      production-dependencies:
        dependency-type: 'production'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
    ignore:
      # BLOCKED, and both were reverted on 2026-09-05 after being merged together in #62.
      # Measured matrix -- no TypeScript version satisfies both gates with vitest 4 + typedoc:
      #   TS 7.0.2  docs CRASH ("Cannot read properties of undefined")  lint pass
      #   TS 6.0.3  docs 7 errors (@types/node unresolved in tests)     lint 76 errors
      #   TS 5.9.3  docs pass                                           lint 38 errors
      # typedoc 0.28.20 is the LATEST and peers at TypeScript <= 6.0.x, so TS 7 has no supported
      # typedoc at all; vitest 4's types degrade to `any` below TS 7, which is what the lint
      # errors are. The two are mutually exclusive until typedoc ships TS 7 support.
      # LIFT BOTH TOGETHER, in ONE PR, once typedoc supports TypeScript 7 -- bumping either alone
      # re-breaks a gate.
      - dependency-name: 'typescript'
        versions: ['>=6']
      - dependency-name: 'vitest'
        versions: ['>=4']
      # BLOCKED on an adoption decision, not on a rebase. #63 merged this and was reverted
      # 2026-09-05; #65 re-proposed it and was closed 2026-09-06 with CI red for the same
      # cause. rapier 0.20 changes four measured behaviours rather than an API:
      #   - a bullet no longer tunnels at a small CCD prediction distance
      #   - a contact distance of 0.005 where <= 0 was expected
      #   - a snapshot-restored joint at -0.75 where > -0.22 was expected
      # It also needs an adapter change: 0.20 inserted a `bodies: RigidBodySet` parameter,
      # so `contactPair(c1, c2, f)` became `contactPair(c1, c2, bodies, f)`.
      # Adopting it is a deliberate call (the CCD change looks like an improvement; the
      # joint one may be a regression) -- see TODO.md, "rapier 0.20 adoption is a real
      # decision, not a bump". Lift this once that decision is made.
      - dependency-name: '@dimforge/rapier2d-compat'
        versions: ['>=0.20']
      - dependency-name: '@dimforge/rapier3d-compat'
        versions: ['>=0.20']
      # BLOCKED behind the pre-existing test-isolation defect. #66 carried eslint 9 -> 10
      # inside a group of eight and went red on `warn`-count assertions -- the §42
      # authority warning firing an extra time under a full run, where the affected tests
      # pass in isolation. A dependency bump neither caused that nor can fix it, and a
      # major linter deserves its own PR rather than a group of eight. Lift once the
      # isolation defect in TODO.md is fixed.
      - dependency-name: 'eslint'
        versions: ['>=10']
      # BLOCKED by a vendored tool. js-yaml 5 removed its default export, and
      # tools/create-dependency-graph does `import yaml from 'js-yaml'`, so `bun run graph`
      # dies with "Missing 'default' export" before it reads a single file. That tool is
      # kept BYTE-IDENTICAL with the copy in llm-wiki (see eslint.config.js) -- changing the
      # import here would guarantee the two copies drift, which is a worse outcome than
      # staying on js-yaml 4. Lift when both copies move together.
      - dependency-name: 'js-yaml'
        versions: ['>=5']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['>=4']

  # Keep the action versions current. Grouped so a week of bumps is one PR, not six.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
