version: 2
updates:
  # npm, NOT bun, DELIBERATELY -- do not "fix" this to bun.
  # Dependabot's bun support parses only bun.lock lockfileVersion 1, and Bun writes version 2
  # (this repo's bun.lock is v2), so every bun-ecosystem run fails immediately with
  #   "Unsupported bun.lock 'lockfileVersion' 2 in /bun.lock"
  # and NO dependency update can be proposed. Diagnosed three times across this workspace on
  # 2026-09-04/05: deepthinking-mcp 524ada7f, fzf-mcp 387ee494, and MathTS c0dd0d12 (where a Bun
  # migration reintroduced it).
  #
  # This hides badly: security ALERTS keep working -- they are dependency-graph based -- so
  # nothing turns red while automated REMEDIATION is dead. "0 open PRs" then reads as health when
  # it partly means "Dependabot cannot open one".
  #
  # The npm ecosystem updates package.json ranges only; bun.lock stays authoritative and is
  # regenerated by `bun install` when a bump lands, never by Dependabot. That avoids carrying two
  # lockfiles, which would be a second source of truth.
  # KNOWN COST: because Dependabot cannot write bun.lock, a bump whose resolution changes will
  # fail CI's `bun install --frozen-lockfile` until the lockfile is regenerated. That follow-up
  # is `.github/workflows/dependabot-bun-lock.yml`: on Dependabot PRs only it runs `bun install`
  # (not frozen), commits bun.lock if it changed, and pushes so CI can go green without a
  # human commit (which would cost the PR its automerge). Revisit when Dependabot's bun parser
  # supports lockfileVersion 2.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: 'development'
      production-dependencies:
        dependency-type: 'production'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
    ignore:
      # The TypeScript ignore is GONE as of 2026-09-08: the root runs typescript@7.0.2.
      # What unblocked it was not a typedoc release. TypeDoc moved into its own workspace
      # package (tools/docs) with typescript@6.0.3 as a DIRECT dependency, so it resolves
      # its own compiler and constrains nothing above it; and typescript-eslint was replaced
      # by oxlint, whose type-aware mode REQUIRES TypeScript 7. Do not re-add a typescript
      # ignore here -- the root is deliberately on 7.x now.
      #
      # tools/docs pins typedoc and typescript@6.0.3 as DIRECT dependencies. It is a bun
      # workspace member, so it has no separate entry here; bun.lock is regenerated by
      # .github/workflows/dependabot-bun-lock.yml, which Dependabot does not maintain itself.
      # #82 (2026-09-09) still bumped tools/docs to 7.0.2 with the root and broke
      # `bun run docs` (`PropertyDeclaration`). `tools/docs/check-compiler.mjs` now
      # refuses any 7.x resolve so that failure is a one-line revert, not a TypeDoc
      # stack. Do not "fix" it by moving tools/docs onto 7; wait for typedoc#3098.
      # Never re-add a typescript ignore to the ROOT, which would pin the compiler too.
      #
      # vitest stays BLOCKED, and for a reason unrelated to TypeScript. vitest 4+ remaps V8
      # coverage accurately where vitest 3 over-reports, so the bump does not break the
      # runner -- all 7,246 tests pass on vitest 5 -- it exposes real coverage gaps that
      # currently fail six thresholds across five packages. Do the coverage work first
      # (TODO.md), then this ignore can go. See docs/MIGRATION.md section 5.
      - dependency-name: 'vitest'
        versions: ['>=4']
      # @dimforge/rapier{2,3}d-compat 0.20.0 adopted 2026-09-06 (contactPair now
      # takes bodies; CCD / contact-distance / snapshot-joint goldens updated).
      # Further 0.20.x / 0.21+ patches may propose themselves; do not re-ignore
      # 0.20 on the old behavioural notes — those tests now track 0.20.
      # The eslint ignore is GONE as of 2026-09-08 -- eslint and typescript-eslint are no
      # longer dependencies of this repository at all. Linting is oxlint (see .oxlintrc.json).
      # The test-isolation defect that blocked eslint 9 -> 10 is unrelated to linting and is
      # still tracked in TODO.md.
      # BLOCKED by a vendored tool. js-yaml 5 removed its default export, and
      # tools/create-dependency-graph does `import yaml from 'js-yaml'`, so `bun run graph`
      # dies with "Missing 'default' export" before it reads a single file. That tool is
      # kept BYTE-IDENTICAL with the copy in llm-wiki (see .oxlintrc.json ignorePatterns) -- changing the
      # import here would guarantee the two copies drift, which is a worse outcome than
      # staying on js-yaml 4. Lift when both copies move together.
      - dependency-name: 'js-yaml'
        versions: ['>=5']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['>=4']

  # Keep the action versions current. Grouped so a week of bumps is one PR, not six.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
